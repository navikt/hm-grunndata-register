name: build-check.yml
on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENCE"
      - "CODEOWNERS"
    branches-ignore:
      - "main"

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: 25
          cache: "gradle"
      - name: Build and test
        run: |
          "./build.sh"
        working-directory: "./"
        env:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}